services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nx_postgres
    restart: unless-stopped
    # Strictly binds to host loopback interface to kill Docker DNS access
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: dev_user
      POSTGRES_PASSWORD: dev_password
      POSTGRES_DB: dev_db
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: nx_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --requirepass dev_redis_password
    volumes:
      - redis_data:/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: nx_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@domain.com
      PGADMIN_DEFAULT_PASSWORD: admin_password
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres

volumes:
  postgres_data:
  redis_data: